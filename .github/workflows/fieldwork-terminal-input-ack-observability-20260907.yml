          python3 scripts/check-spec-inventory.py
          python3 scripts/test_check_resource_api_boundary.py
          python3 scripts/check-resource-api-boundary.py
          python3 bindings/codegen/generate.py --check

      - name: Run diagnostics and receipted-input regressions
        working-directory: cmux-tui
        run: |
          cargo test -p cmux-tui-core --lib terminal_input_receipt_stats_distinguish_timings_and_failure_phases --locked -- --exact --nocapture
          cargo test -p cmux-tui-core --lib receipted_input_ --locked -- --nocapture
          cargo test -p cmux-tui-core --lib host_receipted_input_partial_write_closes_connection_without_ack --locked -- --exact --nocapture
          cargo test -p cmux-tui-core --lib host_receipted_input_flush_failure_closes_connection_without_ack --locked -- --exact --nocapture
          cargo test -p cmux-tui-core --lib host_input_ack_total_budget_rejection_is_post_delivery_connection_loss --locked -- --exact --nocapture
          cargo test -p cmux-tui-core --lib host_input_receipt_follows_pty_write_and_flush --locked -- --exact --nocapture
          cargo test -p cmux-tui-core --lib interactive_input_keeps_fire_and_forget_semantics --locked -- --exact --nocapture
