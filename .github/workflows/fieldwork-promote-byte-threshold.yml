name: Fieldwork promote journal byte threshold

on:
  push:
    branches:
      - fieldwork/nonlinear-resource-collapse
    paths:
      - .github/workflows/fieldwork-promote-byte-threshold.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-byte-threshold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Guard source, promote patch, restore direct verification
        shell: bash
        run: |
          set -euo pipefail
          source_path=cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs
          workflow_path=.github/workflows/fieldwork-nonlinear-resource-collapse.yml
          expected_blob=1612a94000303493ede291d462594c32b679d16f
          actual_blob=$(git hash-object "$source_path")
          if [[ "$actual_blob" != "$expected_blob" ]]; then
            echo "source blob is $actual_blob; expected tested source $expected_blob" >&2
            exit 1
          fi

          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fieldwork-nonlinear-resource-collapse.yml')
          text = path.read_text()
          old = '''      - name: Apply byte-threshold candidate and recovery harness
        run: |
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git diff --check
'''
          new = '''      - name: Apply recovery measurement harness
        run: |
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git diff --check
'''
          if old not in text:
              raise SystemExit('expected candidate workflow block missing')
          path.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "Fieldwork automation"
          git config user.email "actions@users.noreply.github.com"
          git add "$source_path" "$workflow_path"
          git commit -m "fix(relay): continue byte-bounded journal batches immediately"
          git push origin HEAD:fieldwork/nonlinear-resource-collapse
