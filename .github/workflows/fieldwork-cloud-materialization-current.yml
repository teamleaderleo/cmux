name: Fieldwork cloud materialization current main

on:
  pull_request:
    branches:
      - fieldwork/cloud-materialization-current-verifier-base-544c0e0f
    paths:
      - "cmux-tui/crates/cmux-remote/src/lib.rs"
      - "cmux-tui/crates/cmux-remote/src/materialization.rs"
      - "cmux-tui/crates/cmux-tui-core/src/lib.rs"
      - "cmux-tui/crates/cmux-tui-core/src/materialization.rs"
      - "cmux-tui/crates/cmux-tui/src/materialization_cli.rs"
      - "cmux-tui/crates/cmux-tui/src/provider_authority.rs"
      - "cmux-tui/crates/cmux-tui/tests/cloud_materialization_rekey.rs"
      - "web/services/vms/drivers/cmuxTuiMaterialization.ts"
      - "web/services/vms/providerGateway.ts"
      - "web/tests/vm-cmux-tui-materialization-provider.test.ts"
      - ".github/workflows/fieldwork-cloud-materialization-current.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: false

      - name: Require exact candidate ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "695f982c36b6d56e6ec02d05763764e24817ed50"
          test "$(git rev-parse HEAD^^)" = "544c0e0ff4f3aebb1a34eb8503c7ccc1f33a2de8"

      - name: Init Ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Run Cloud materialization integration tests
        working-directory: cmux-tui
        run: cargo test -p cmux-tui --test cloud_materialization_rekey --locked -- --nocapture

      - name: Run private dispatcher regression tests
        working-directory: cmux-tui
        run: cargo test -p cmux-tui provider_authority --locked -- --nocapture

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require exact candidate ancestry
        run: |
          test "$(git rev-parse HEAD^)" = "695f982c36b6d56e6ec02d05763764e24817ed50"
          test "$(git rev-parse HEAD^^)" = "544c0e0ff4f3aebb1a34eb8503c7ccc1f33a2de8"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run provider materialization tests
        working-directory: web
        run: bun test tests/vm-cmux-tui-materialization-provider.test.ts
