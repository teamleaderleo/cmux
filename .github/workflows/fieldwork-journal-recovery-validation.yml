name: Fieldwork journal recovery validation

on:
  push:
    branches:
      - fieldwork/journal-recovery-validation
    paths:
      - .github/workflows/fieldwork-journal-recovery-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-baseline:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin current upstream journal source
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/manaflow-ai/cmux.git || true
          git fetch --no-tags upstream 9e2dd50957936153ca0da61d2f079937674f9375
          git checkout --detach 9e2dd50957936153ca0da61d2f079937674f9375
          test "$(git hash-object cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs)" = "9b4551770e807084c48c2cdbe94f15f2cf2358e0"
      - name: Materialize measurement-only backlog harness
        run: |
          set -euo pipefail
          git fetch --no-tags origin fieldwork/nonlinear-resource-collapse
          git show origin/fieldwork/nonlinear-resource-collapse:cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs > cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs
      - name: Build upstream backlog harness
        working-directory: cmux-tui
        run: cargo build -p chatmux-relay --example fieldwork_journal_backlog
      - name: Measure upstream stalled-delivery scaling
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          mkdir -p ../fieldwork-results/upstream
          for sessions in 1 10 50 200; do
            echo "=== upstream stall sessions=${sessions} ==="
            cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
              --sessions "${sessions}" \
              --records-per-session 1000 \
              --payload-bytes 2048 \
              --mode stall \
              --settle-millis 500 \
              | tee "../fieldwork-results/upstream/stall-${sessions}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: journal-upstream-baseline
          path: fieldwork-results/upstream

  bounded-candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize recovery harness
        run: |
          set -euo pipefail
          git fetch --no-tags origin fieldwork/nonlinear-resource-collapse
          git show origin/fieldwork/nonlinear-resource-collapse:cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs > cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs
          git show origin/fieldwork/nonlinear-resource-collapse:scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch > /tmp/journal_recovery_harness.patch
          git apply --check /tmp/journal_recovery_harness.patch
          git apply /tmp/journal_recovery_harness.patch
      - name: Add measurement-only queue and retry counters
        run: |
          set -euo pipefail
          python3 - <<'PY'
