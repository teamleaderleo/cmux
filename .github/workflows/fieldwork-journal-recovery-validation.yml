name: Fieldwork journal recovery validation

on:
  push:
    branches:
      - fieldwork/journal-recovery-validation
    paths:
      - .github/workflows/fieldwork-journal-recovery-validation.yml
      - scripts/fieldwork/cmux-resource-collapse/journal_validation_instrument.py
      - scripts/fieldwork/cmux-resource-collapse/journal_backlog_base.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-baseline:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pin current upstream journal source
        run: |
          set -euo pipefail
          cp scripts/fieldwork/cmux-resource-collapse/journal_backlog_base.rs /tmp/fieldwork_journal_backlog.rs
          git remote add upstream https://github.com/manaflow-ai/cmux.git || true
          git fetch --no-tags upstream 9e2dd50957936153ca0da61d2f079937674f9375
          git checkout --detach 9e2dd50957936153ca0da61d2f079937674f9375
          test "$(git hash-object cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs)" = "9b4551770e807084c48c2cdbe94f15f2cf2358e0"
      - name: Materialize measurement-only backlog harness
        run: |
          set -euo pipefail
          mkdir -p cmux-tui/crates/chatmux-relay/examples
          cp /tmp/fieldwork_journal_backlog.rs cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs
      - name: Build upstream backlog harness
        working-directory: cmux-tui
        run: cargo build -p chatmux-relay --example fieldwork_journal_backlog
      - name: Measure upstream stalled-delivery scaling
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          mkdir -p ../fieldwork-results/upstream
          for sessions in 1 10 50 200; do
            echo "=== upstream stall sessions=${sessions} ==="
            cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
              --sessions "${sessions}" \
              --records-per-session 1000 \
              --payload-bytes 2048 \
              --mode stall \
              --settle-millis 500 \
              | tee "../fieldwork-results/upstream/stall-${sessions}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-upstream-baseline
          path: fieldwork-results/upstream

  bounded-candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Materialize base fieldwork harness
        run: |
          set -euo pipefail
          mkdir -p cmux-tui/crates/chatmux-relay/examples
          cp scripts/fieldwork/cmux-resource-collapse/journal_backlog_base.rs cmux-tui/crates/chatmux-relay/examples/fieldwork_journal_backlog.rs
      - name: Generate recovery harness and measurement counters
        run: |
          set -euo pipefail
          python3 scripts/fieldwork/cmux-resource-collapse/journal_validation_instrument.py
          git diff --check
      - name: Run journal-forwarder unit tests
        working-directory: cmux-tui
        run: cargo test -p chatmux-relay journal_forwarder -- --nocapture
      - name: Build bounded recovery harness
        working-directory: cmux-tui
        run: cargo build -p chatmux-relay --example fieldwork_journal_backlog
      - name: Healthy control across session scaling
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          mkdir -p ../fieldwork-results/candidate
          for sessions in 1 10 50 128 200; do
            echo "=== candidate ack sessions=${sessions} ==="
            cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
              --sessions "${sessions}" \
              --records-per-session 40 \
              --payload-bytes 2048 \
              --mode ack \
              --settle-millis 300 \
              | tee "../fieldwork-results/candidate/ack-${sessions}.json"
          done
      - name: Stalled delivery scaling and long-lived control
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          for sessions in 1 10 50 128 200; do
            echo "=== candidate stall sessions=${sessions} ==="
            cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
              --sessions "${sessions}" \
              --records-per-session 100000 \
              --payload-bytes 2048 \
              --mode stall \
              --load-millis 2000 \
              --settle-millis 500 \
              | tee "../fieldwork-results/candidate/stall-${sessions}.json"
          done
          echo "=== candidate long stall sessions=128 ==="
          cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
            --sessions 128 \
            --records-per-session 100000 \
            --payload-bytes 2048 \
            --mode stall \
            --load-millis 10000 \
            --settle-millis 500 \
            | tee ../fieldwork-results/candidate/stall-128-long.json
      - name: Interrupted then restored delivery
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          for sessions in 1 10 50 128; do
            echo "=== candidate recover sessions=${sessions} ==="
            cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
              --sessions "${sessions}" \
              --records-per-session 100000 \
              --payload-bytes 2048 \
              --mode recover \
              --load-millis 500 \
              --settle-millis 300 \
              | tee "../fieldwork-results/candidate/recover-${sessions}.json"
          done
      - name: Retry then recover
        working-directory: cmux-tui
        run: |
          set -euo pipefail
          cargo run --quiet -p chatmux-relay --example fieldwork_journal_backlog -- \
            --sessions 50 \
            --records-per-session 100000 \
            --payload-bytes 2048 \
            --mode retry-recover \
            --load-millis 5000 \
            --settle-millis 300 \
            | tee ../fieldwork-results/candidate/retry-recover-50.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-bounded-candidate
          path: fieldwork-results/candidate
