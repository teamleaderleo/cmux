name: Promote remote resource bounds

on:
  push:
    branches:
      - fix/remote-resource-bounds
    paths:
      - .github/workflows/promote-remote-resource-bounds.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply green candidate stack
        run: |
          set -euo pipefail
          client_path=Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonRPCClient.swift
          git apply --check --recount --exclude="$client_path" \
            scripts/fieldwork/cmux-resource-collapse/event_delivery_budget_candidate_v2.patch
          git apply --recount --exclude="$client_path" \
            scripts/fieldwork/cmux-resource-collapse/event_delivery_budget_candidate_v2.patch
          for patch in \
            event_delivery_client_candidate.patch \
            event_delivery_budget_candidate_runtime_repair.patch \
            event_delivery_budget_candidate_storage_repair.patch \
            event_delivery_budget_candidate_tests.patch \
            event_delivery_budget_candidate_tests_repair.patch \
            event_delivery_budget_candidate_tests_snapshot_repair.patch \
            event_delivery_candidate_subscription_retirement_repair.patch \
            event_delivery_candidate_pty_retirement_test.patch \
            timeout_isolation_harness_repair.patch; do
            git apply --check --recount "scripts/fieldwork/cmux-resource-collapse/${patch}"
            git apply --recount "scripts/fieldwork/cmux-resource-collapse/${patch}"
          done
          for patch in \
            proxy_slow_reader_probe.patch \
            proxy_probe_chunk_size.patch \
            proxy_output_budget_candidate.patch \
            proxy_output_budget_candidate_repair.patch \
            proxy_candidate_probe_expectations.patch; do
            git apply --check --recount "scripts/fieldwork/cmux-resource-collapse/${patch}"
            git apply --recount "scripts/fieldwork/cmux-resource-collapse/${patch}"
          done
      - name: Remove experiment-only load harnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonEventDeliveryQueueTests.swift')
          text = path.read_text()
          start = text.index('private let fieldworkBoundedDeliveryEnabled =')
          end = text.index('private final class LockedStrings')
          path.write_text(text[:start] + text[end:])
          PY
          rm -f Packages/macOS/CmuxRemoteWorkspace/Tests/CmuxRemoteWorkspaceTests/RemoteDaemonProxySessionSlowReaderProbeTests.swift
          git checkout -- Packages/macOS/CmuxRemoteWorkspace/Package.swift
      - name: Stage production source and deterministic tests
        run: |
          set -euo pipefail
          git add \
            Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonEventDeliveryQueue.swift \
            Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonRPCClient+Events.swift \
            Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonRPCClient+RPC.swift \
            Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonRPCClient.swift \
            Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonEventDeliveryQueueTests.swift \
            Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonRPCClientTimeoutIsolationTests.swift \
            Packages/macOS/CmuxRemoteWorkspace/Sources/CmuxRemoteWorkspace/Rewriters/RemoteLoopbackHTTPResponseStreamRewriter.swift \
            Packages/macOS/CmuxRemoteWorkspace/Sources/CmuxRemoteWorkspace/Tunnel/RemoteDaemonProxySession.swift \
            Packages/macOS/CmuxRemoteWorkspace/Sources/CmuxRemoteWorkspace/Tunnel/RemoteProxyOutputBudget.swift \
            Packages/macOS/CmuxRemoteWorkspace/Tests/CmuxRemoteWorkspaceTests/RemoteProxyOutputBudgetTests.swift
          git rm .github/workflows/promote-remote-resource-bounds.yml
          git diff --cached --check
          git status --short
      - name: Direct-source package tests
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxRemoteDaemon
          swift test --package-path Packages/macOS/CmuxRemoteWorkspace
      - name: Commit promoted source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(remote): bound event and proxy output retention"
          git push origin HEAD:fix/remote-resource-bounds
