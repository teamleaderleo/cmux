name: Fork candidate CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-candidate-ci.yml

permissions:
  contents: read

env:
  UPSTREAM_BASE_SHA: 244adb38efdb8dea6fde624b079a0083738049d5
  RED_SHA: 00f86777f311f0bfe014b54c45bbac16624cb3cf
  GREEN_SHA: 779e8e3fefe38f4a839a287124101e42126e004e
  SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no

jobs:
  verify-candidate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GREEN_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify candidate ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RED_SHA^")" = "$UPSTREAM_BASE_SHA"
          test "$(git rev-parse "$GREEN_SHA^")" = "$RED_SHA"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Prepare DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-fork-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Prove regression commit is red
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          set +e
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxSendKeysBoundaryTests/boundaryPasteIsSplitIntoControlSafeCommands \
              test
          RED_STATUS=$?
          set -e
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "expected the test-only commit to fail"
            exit 1
          fi
          echo "observed expected red test exit: $RED_STATUS"

      - name: Prove fix commit is green
        run: |
          set -euo pipefail
          git checkout --detach "$GREEN_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxSendKeysBoundaryTests/boundaryPasteIsSplitIntoControlSafeCommands \
              test

      - name: Run relevant remote-tmux tests
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests \
              -only-testing:cmuxTests/RemoteTmuxSendKeysBoundaryTests \
              test

      - name: Run package tests
        run: swift test --package-path Packages/macOS/CmuxRemoteSession

      - name: Repository guards
        run: |
          set -euo pipefail
          git diff --check "$UPSTREAM_BASE_SHA" "$GREEN_SHA"
          ./scripts/lint-pbxproj-test-wiring.sh
          python3 scripts/check-package-resolved-policy.py
          python3 scripts/check-workspace-package-groups.py --check
