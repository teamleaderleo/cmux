name: Fork candidate CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-candidate-ci.yml

permissions:
  contents: write

jobs:
  ssh-tmux-sendkeys-current-main:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CANDIDATE_BRANCH: fix/ssh-tmux-sendkeys-current-main
      SNAPSHOT_BRANCH: fieldwork/sendkeys-snapshot-64055249
      UPSTREAM_BASE_SHA: 244adb38efdb8dea6fde624b079a0083738049d5
      SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
    steps:
      - name: Checkout exact-base candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          fetch-depth: 0
          submodules: recursive

      - name: Build red and green candidate commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$UPSTREAM_BASE_SHA"
          git config user.name "teamleaderleo"
          git config user.email "cheerleaderleo@outlook.com"

          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          path = Path("cmuxTests/RemoteTmuxAuthTests.swift")
          text = path.read_text()
          test_name = "sendKeysChunksBoundaryPasteIntoControlSafeCommands"
          if test_name in text:
              raise SystemExit("boundary regression already present before red commit")

          test_anchor = "    @Test @MainActor func pastePaneRejectsDisconnectedControlStream() {"
          if test_anchor not in text:
              raise SystemExit("pastePane test insertion anchor drifted")
          regression = indent(dedent('''\
          @Test @MainActor func sendKeysChunksBoundaryPasteIntoControlSafeCommands() async throws {
              let data = Data((0 ..< 9_995).map { UInt8($0 % 251) })
              let emission = try await captureSendKeysWire(
                  paneId: 7,
                  data: data,
                  maxPendingBytes: 1 << 20
              )

              #expect(emission.accepted)
              #expect(emission.commands.count >= 2)
              #expect(emission.commands.allSatisfy { $0.utf8.count < 30_000 })
              #expect(try decodeHexArguments(from: emission.commands, paneId: 7) == data)
          }

          '''), "    ")
          text = text.replace(test_anchor, regression + test_anchor, 1)

          helper_anchor = "    /// True when `a` is immediately followed by `b` in `args` — i.e. an ssh"
          if helper_anchor not in text:
              raise SystemExit("helper insertion anchor drifted")
          helpers = indent(dedent('''\
          @MainActor
          private func captureSendKeysWire(
              paneId: Int,
              data: Data,
              maxPendingBytes: Int
          ) async throws -> (accepted: Bool, commands: [String]) {
              let connection = RemoteTmuxControlConnection(
                  host: RemoteTmuxHost(destination: "user@input-transport"),
                  sessionName: "input-transport"
              )
              let bootstrapPipe = Pipe()
              let bootstrapWriter = RemoteTmuxControlPipeWriter(
                  handle: bootstrapPipe.fileHandleForWriting,
                  label: "remote-tmux-send-keys-bootstrap-test",
                  maxPendingBytes: 1 << 16,
                  onFailure: {}
              )
              let pipe = Pipe()
              let writer = RemoteTmuxControlPipeWriter(
                  handle: pipe.fileHandleForWriting,
                  label: "remote-tmux-send-keys-wire-test",
                  maxPendingBytes: maxPendingBytes,
                  onFailure: {}
              )
              defer {
                  bootstrapWriter.close()
                  try? bootstrapPipe.fileHandleForReading.close()
                  writer.close()
                  try? pipe.fileHandleForReading.close()
              }

              connection.installStdinWriterForTesting(bootstrapWriter)
              connection.handleMessageForTesting(.enter)
              connection.handleMessageForTesting(.commandResult(commandNumber: 0, lines: [], isError: false))
              connection.installStdinWriterForTesting(writer)

              let accepted = connection.sendKeys(paneId: paneId, data: data)
              writer.close()
              var lineData = Data()
              var commands: [String] = []
              for try await byte in pipe.fileHandleForReading.bytes {
                  guard byte == UInt8(ascii: "\\n") else {
                      lineData.append(byte)
                      continue
                  }
                  commands.append(String(decoding: lineData, as: UTF8.self))
                  lineData.removeAll(keepingCapacity: true)
              }
              #expect(lineData.isEmpty)
              return (accepted, commands)
          }

          private func decodeHexArguments(from commands: [String], paneId: Int) throws -> Data {
              let prefix = "send-keys -t %\\(paneId) -H "
              var decoded = Data()
              for command in commands {
                  #expect(command.hasPrefix(prefix))
                  for argument in command.dropFirst(prefix.count).split(separator: " ") {
                      decoded.append(try #require(UInt8(argument, radix: 16)))
                  }
              }
              return decoded
          }

          '''), "    ")
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)
          path.write_text(text)
          PY

          git add cmuxTests/RemoteTmuxAuthTests.swift
          git commit -m "test: prove ssh-tmux paste command boundary"
          RED_SHA=$(git rev-parse HEAD)
          echo "RED_SHA=$RED_SHA" >> "$GITHUB_ENV"

          git fetch origin "$SNAPSHOT_BRANCH:refs/remotes/origin/$SNAPSHOT_BRANCH"
          git checkout "origin/$SNAPSHOT_BRANCH" -- \
            Packages/macOS/CmuxRemoteSession/Sources/CmuxRemoteSession/RemoteTmux/RemoteTmuxSendKeysBatchBuilder.swift \
            Sources/RemoteTmuxControlConnection+Commands.swift \
            Sources/RemoteTmuxControlConnection.swift \
            Sources/RemoteTmuxPaneInputForwarder.swift
          git add \
            Packages/macOS/CmuxRemoteSession/Sources/CmuxRemoteSession/RemoteTmux/RemoteTmuxSendKeysBatchBuilder.swift \
            Sources/RemoteTmuxControlConnection+Commands.swift \
            Sources/RemoteTmuxControlConnection.swift \
            Sources/RemoteTmuxPaneInputForwarder.swift
          git commit -m "fix: bound ssh-tmux send-key batches"
          GREEN_SHA=$(git rev-parse HEAD)
          echo "GREEN_SHA=$GREEN_SHA" >> "$GITHUB_ENV"
          git push origin "HEAD:$CANDIDATE_BRANCH"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Prepare DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-fork-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Prove regression commit is red
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          set +e
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/sendKeysChunksBoundaryPasteIntoControlSafeCommands \
              test
          RED_STATUS=$?
          set -e
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "expected the test-only commit to fail"
            exit 1
          fi
          echo "observed expected red test exit: $RED_STATUS"

      - name: Prove fix commit is green
        run: |
          set -euo pipefail
          git checkout --detach "$GREEN_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/sendKeysChunksBoundaryPasteIntoControlSafeCommands \
              test

      - name: Run relevant remote-tmux tests
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests \
              test

      - name: Repository guards
        run: |
          set -euo pipefail
          git diff --check "$UPSTREAM_BASE_SHA" "$GREEN_SHA"
          ./scripts/lint-pbxproj-test-wiring.sh
          python3 scripts/check-package-resolved-policy.py
          python3 scripts/check-workspace-package-groups.py --check
