name: Fieldwork terminal input ACK fixture diagnostic

on:
  push:
    branches:
      - fieldwork/terminal-input-ack-fixture-diagnostic-20260907

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Find terminal reservation helpers
        shell: bash
        run: |
          set -euo pipefail
          echo '=== reserve APIs ==='
          grep -R -n -E -C 8 'pub(\(crate\))? fn .*reserve.*terminal|fn .*reserve.*terminal|reserve_terminal|RegistryTerminal \{' cmux-tui/crates/cmux-tui-core/src/mux.rs | head -n 1200 || true
          echo '=== test helpers near pending topology ==='
          sed -n '27980,28130p' cmux-tui/crates/cmux-tui-core/src/mux.rs
          echo '=== Mux test constructor/helper signatures ==='
          grep -n -E -C 5 'fn test_mux\(|pub.*for_test|workspace_registry.*for_test|terminal.*for_test' cmux-tui/crates/cmux-tui-core/src/mux.rs | head -n 1000 || true
