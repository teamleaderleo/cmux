name: Fork CI mark PR ready

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fork-ci-mark-pr-ready.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mark terminal input PR ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 16 --repo "$GITHUB_REPOSITORY"
