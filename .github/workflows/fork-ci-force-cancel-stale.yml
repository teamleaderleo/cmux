name: Fork CI force-cancel stale runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fork-ci-force-cancel-stale.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Force-cancel residual queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          forced=0
          for state in queued pending waiting requested; do
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue
              echo "Force-cancelling $state run $run_id"
              if gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null 2>&1; then
                forced=$((forced + 1))
              fi
            done < <(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '.workflow_runs[].id')
          done
          echo "Force-cancelled $forced residual runs"
