          parser_status=${PIPESTATUS[0]}
          ./scripts/test-unit.sh test -only-testing:cmuxTests/SocketTerminalBindingRegressionTests/camelCaseSurfaceAliasCannotInjectIntoFocusedTerminal 2>&1 | tee /tmp/943-app-red.log
