name: Fieldwork refresh 942-945 on upstream 52d0a696

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fieldwork-refresh-942-945-52d0a696.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-refresh-942-945-52d0a696
  cancel-in-progress: false

env:
  BASE_SHA: 52d0a69623430c72d7b5db4b4a5d27c692c30a19

jobs:
  issue-942:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Create exact-base branch and RED test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git switch -C fieldwork/942-missing-cwd-refresh-52d0a696 "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          cat > cmuxTests/TerminalStartupWorkingDirectoryPrefixRefreshTests.swift <<'SWIFT'
          import Foundation
          import Testing
          #if canImport(cmux_DEV)
          @testable import cmux_DEV
          #elseif canImport(cmux)
          @testable import cmux
          #endif

          @Suite("Persisted restore working directory refresh")
          struct TerminalStartupWorkingDirectoryPrefixRefreshTests {
              @Test
              func missingPersistedWorkingDirectoryFailsClosed() throws {
                  let inherited = FileManager.default.temporaryDirectory
                      .appendingPathComponent("cmux-fieldwork-inherited-\(UUID().uuidString)", isDirectory: true)
                  try FileManager.default.createDirectory(at: inherited, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(at: inherited) }
                  let missing = inherited.appendingPathComponent("removed-saved-repository").path
                  let marker = inherited.appendingPathComponent("payload-ran")
                  let command = TerminalStartupWorkingDirectoryPrefix.prefix(
                      "printf payload > \(shellQuote(marker.path))",
                      workingDirectory: missing
                  )
                  let status = try runShell(command, cwd: inherited)
                  #expect(status != 0)
                  #expect(!FileManager.default.fileExists(atPath: marker.path))
              }

              @Test
              func existingPersistedWorkingDirectoryRunsThereWithQuotedPath() throws {
                  let root = FileManager.default.temporaryDirectory
                      .appendingPathComponent("cmux-fieldwork-cwd-\(UUID().uuidString)", isDirectory: true)
                  let saved = root.appendingPathComponent("repo with ' quote", isDirectory: true)
                  try FileManager.default.createDirectory(at: saved, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(at: root) }
                  let marker = root.appendingPathComponent("pwd")
                  let command = TerminalStartupWorkingDirectoryPrefix.prefix(
                      "pwd > \(shellQuote(marker.path))",
                      workingDirectory: saved.path
                  )
                  #expect(try runShell(command, cwd: root) == 0)
                  let observed = try String(contentsOf: marker, encoding: .utf8)
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  #expect(observed == saved.path)
              }

              @Test
              func optionalPlacementRetainsFallbackSemantics() throws {
                  let inherited = FileManager.default.temporaryDirectory
                      .appendingPathComponent("cmux-fieldwork-optional-\(UUID().uuidString)", isDirectory: true)
                  try FileManager.default.createDirectory(at: inherited, withIntermediateDirectories: true)
                  defer { try? FileManager.default.removeItem(at: inherited) }
                  let missing = inherited.appendingPathComponent("missing-optional-directory").path
                  let marker = inherited.appendingPathComponent("optional-pwd")
                  let prefix = try #require(
                      TerminalStartupWorkingDirectoryPrefix.optionalChangeDirectoryPrefix(for: missing)
                  )
                  #expect(try runShell(prefix + "pwd > \(shellQuote(marker.path))", cwd: inherited) == 0)
                  let observed = try String(contentsOf: marker, encoding: .utf8)
                      .trimmingCharacters(in: .whitespacesAndNewlines)
                  #expect(observed == inherited.path)
              }

              @Test
              func requiredPrefixKeepsFishCompatibleAndNushellDelegatedSyntax() {
                  let posix = TerminalStartupWorkingDirectoryPrefix.prefix(
                      "'claude' '--resume' 'SID'",
                      workingDirectory: "/tmp/repo"
                  )
                  #expect(!posix.contains("{"))
                  #expect(posix.contains(" 2>/dev/null && "))
                  #expect(!posix.contains("[ ! -d"))
                  let typed = TerminalStartupTypedShellCommand(dialect: .nushell)
                      .typedInput(posixCommand: posix)
                  #expect(typed.hasPrefix("^/bin/sh -c "))
              }

              private func runShell(_ command: String, cwd: URL) throws -> Int32 {
                  let process = Process()
                  process.executableURL = URL(fileURLWithPath: "/bin/sh")
                  process.arguments = ["-c", command]
                  process.currentDirectoryURL = cwd
                  try process.run()
                  process.waitUntilExit()
                  return process.terminationStatus
              }

              private func shellQuote(_ value: String) -> String {
                  "'" + value.replacingOccurrences(of: "'", with: "'\\''") + "'"
              }
          }
          SWIFT
          git add cmuxTests/TerminalStartupWorkingDirectoryPrefixRefreshTests.swift
          git commit -m 'test: fail closed when persisted restore cwd disappears'
          echo "RED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Select Xcode and GhosttyKit
        run: |
          ./scripts/select-ci-xcode.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - name: RED missing persisted cwd launches inherited payload today
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./scripts/test-unit.sh test -only-testing:cmuxTests/TerminalStartupWorkingDirectoryPrefixRefreshTests/missingPersistedWorkingDirectoryFailsClosed 2>&1 | tee /tmp/942-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'missingPersistedWorkingDirectoryFailsClosed' /tmp/942-red.log
          echo "942 RED exit=$status red_sha=$RED_SHA base=$BASE_SHA"
      - name: Apply smallest required-placement repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/RestorableAgentSession.swift')
          s = p.read_text()
          old = '''    static func prefix(_ command: String, workingDirectory: String?) -> String {
              guard let prefix = optionalChangeDirectoryPrefix(for: workingDirectory) else {
                  return command
              }
              return prefix + command
          }
          '''
          new = '''    static func prefix(_ command: String, workingDirectory: String?) -> String {
              guard let workingDirectory = normalized(workingDirectory) else { return command }
              let quoted = TerminalStartupShellQuoting.singleQuoted(workingDirectory)
              return "cd -- \\(quoted) 2>/dev/null && \\(command)"
          }
          '''
          if old not in s:
              raise SystemExit('required prefix owner drifted')
          p.write_text(s.replace(old, new, 1))

          p = Path('CLI/CMUXCLI+SessionsListForkStartupInput.swift')
          s = p.read_text()
          old = 'return "cd -- \\(quoted) 2>/dev/null || [ ! -d \\(quoted) ] && \\(command)"'
          new = 'return "cd -- \\(quoted) 2>/dev/null && \\(command)"'
          if old not in s:
              raise SystemExit('CLI cwd owner drifted')
          p.write_text(s.replace(old, new, 1))
          PY
          git add Sources/RestorableAgentSession.swift CLI/CMUXCLI+SessionsListForkStartupInput.swift
          git commit -m 'fix: fail closed for persisted restore working directory'
          echo "GREEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" HEAD
      - name: GREEN discriminator and focused controls
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-unit.sh test -only-testing:cmuxTests/TerminalStartupWorkingDirectoryPrefixRefreshTests 2>&1 | tee /tmp/942-green.log
          grep -F 'missingPersistedWorkingDirectoryFailsClosed' /tmp/942-green.log
          ./scripts/test-unit.sh test -only-testing:cmuxTests/ShellStartupMatrixTests/typedShellCommandWrapsPosixForNushellOnly
          ./scripts/test-unit.sh test -only-testing:cmuxTests/SessionPersistenceTests
          echo "942 GREEN green_sha=$GREEN_SHA base=$BASE_SHA"
      - name: Push evidence branch
        run: git push --force origin HEAD:refs/heads/fieldwork/942-missing-cwd-refresh-52d0a696

  issue-943:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
