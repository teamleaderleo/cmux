          ./scripts/test-unit.sh test -only-testing:cmuxTests/SocketTerminalBindingRegressionTests/camelCaseSurfaceAliasCannotInjectIntoFocusedTerminal 2>&1 | tee /tmp/943-app-green.log
          grep -F 'strictRejectsCamelCaseTargetAlias' /tmp/943-package-green.log
          grep -F 'camelCaseSurfaceAliasCannotInjectIntoFocusedTerminal' /tmp/943-app-green.log
          echo "943 GREEN green_sha=$GREEN_SHA base=$BASE_SHA"
