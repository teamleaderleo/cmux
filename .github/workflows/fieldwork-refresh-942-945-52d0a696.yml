name: Fieldwork 943 read-side refresh on 52d0a696

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fieldwork-refresh-942-945-52d0a696.yml

permissions:
  contents: write

env:
  BASE_SHA: 52d0a69623430c72d7b5db4b4a5d27c692c30a19
  RED_SHA: 94879639fb527d09b6125e4d1040188387b7060f

jobs:
  issue-943-readproof:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RED_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Verify exact test-first ancestry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git switch -C fieldwork/943-rpc-target-alias-readproof-52d0a696 "$RED_SHA"
      - name: Select Xcode and GhosttyKit
        run: |
          ./scripts/select-ci-xcode.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - name: RED parser accepts known target aliases
        shell: bash
        run: |
          set -euo pipefail
          set +e
          swift test --package-path Packages/macOS/CmuxControlSocket --filter strictRejectsKnownTargetAliasVariants 2>&1 | tee /tmp/943-parser-red-read.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'strictRejectsKnownTargetAliasVariants' /tmp/943-parser-red-read.log
          echo "943 parser RED exit=$status red_sha=$RED_SHA base=$BASE_SHA"
      - name: RED read-only terminal replay falls through to focus
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./scripts/test-unit.sh test -only-testing:cmuxTests/RPCTargetAliasReadProofTests/camelCaseSurfaceAliasCannotReplayFocusedTerminal 2>&1 | tee /tmp/943-read-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'camelCase surfaceId silently replayed the focused terminal' /tmp/943-read-red.log
          echo "943 read RED exit=$status red_sha=$RED_SHA base=$BASE_SHA"
      - name: Apply narrow target-alias repair
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick a36ffbe0b8c3acedeb7ab82454ae6cec65ec5d06
          echo "GREEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" HEAD
      - name: GREEN parser contract
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxControlSocket 2>&1 | tee /tmp/943-parser-green-read.log
          grep -F 'strictRejectsKnownTargetAliasVariants' /tmp/943-parser-green-read.log
          grep -F 'strictPreservesCanonicalNoTargetAndUnrelatedExtensionKeys' /tmp/943-parser-green-read.log
      - name: GREEN read and no-target app controls
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-unit.sh test \
            -only-testing:cmuxTests/RPCTargetAliasReadProofTests/camelCaseSurfaceAliasCannotReplayFocusedTerminal \
            -only-testing:cmuxTests/RPCTargetAliasReadProofTests/trueNoTargetReplayStillUsesFocusedTerminal \
            2>&1 | tee /tmp/943-app-green-read.log
          grep -F 'camelCaseSurfaceAliasCannotReplayFocusedTerminal' /tmp/943-app-green-read.log
          grep -F 'trueNoTargetReplayStillUsesFocusedTerminal' /tmp/943-app-green-read.log
          echo "943 GREEN green_sha=$GREEN_SHA base=$BASE_SHA"
      - name: Push complete evidence branch
        run: git push --force origin HEAD:refs/heads/fieldwork/943-rpc-target-alias-readproof-52d0a696
