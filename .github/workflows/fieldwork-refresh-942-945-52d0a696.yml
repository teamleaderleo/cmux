      - name: Select Xcode and GhosttyKit
        run: |
          ./scripts/select-ci-xcode.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - name: RED execute production branch across A to B generation reuse
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./scripts/test-unit.sh test -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests/delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession 2>&1 | tee /tmp/944-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F 'Test run started' /tmp/944-red.log
          grep -F 'delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession' /tmp/944-red.log
          echo "944 RED exit=$status red_sha=$RED_SHA base=$BASE_SHA"
      - name: Apply ingress-captured physical generation repair
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick ffa4d1ad5ffc620fa0cf04b5a91e54f3e9aa2b7f
          echo "GREEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" HEAD
      - name: GREEN exact discriminator and adjacent current-generation control
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-unit.sh test -only-testing:cmuxTests/ComputerUseCrossGenerationIdentityTests/delayedGenerationACompletionCannotResolveGenerationBWithSameLogicalSession 2>&1 | tee /tmp/944-green.log
          grep -F 'Test run started' /tmp/944-green.log
          ./scripts/test-unit.sh test -only-testing:cmuxTests/ComputerUseUXTests/computerUseHookResolutionAcceptsTheCurrentProcessGenerationWhenAgentIDsDiffer
          grep -F 'FeedIngressProcessGenerationEvent' Sources/Feed/WorkstreamEvent+FeedIngress.swift
          echo "944 GREEN green_sha=$GREEN_SHA base=$BASE_SHA"
      - name: Push evidence branch
        run: git push --force origin HEAD:refs/heads/fieldwork/944-computer-use-generation-refresh-52d0a696

  issue-945:
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          submodules: recursive
      - name: Create exact-base branch and current-compatible physical RED
        shell: bash
        run: |
          set -euo pipefail
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git switch -C fieldwork/945-remote-write-liveness-refresh-52d0a696 "$BASE_SHA"
          git fetch origin fieldwork/nonlinear-resource-collapse:refs/remotes/origin/fieldwork/nonlinear-resource-collapse
          git show origin/fieldwork/nonlinear-resource-collapse:Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonRPCClientWriteAdmissionScalingTests.swift > Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonRPCClientWriteAdmissionScalingTests.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonRPCClientWriteAdmissionScalingTests.swift')
          s = p.read_text()
          needle = 'private let fieldworkWriteScalingEnabled =\n    ProcessInfo.processInfo.environment["CMUX_FIELDWORK_SCALING"] == "1"\n'
          replacement = needle + '''\nprivate let fieldworkWriteScalingCases: [Int] = {\n    guard let raw = ProcessInfo.processInfo.environment["CMUX_FIELDWORK_SCALING_CASES"],\n          !raw.isEmpty else { return [1, 10, 50, 200] }\n    return raw.split(separator: ",").compactMap { Int($0) }\n}()\n'''
          if needle not in s:
              raise SystemExit('scaling gate drifted')
          s = s.replace(needle, replacement, 1)
          s = s.replace('for callers in [1, 10, 50, 200] {', 'for callers in fieldworkWriteScalingCases {')
          old = '''                missingPersistentPTYCapability: "missing persistent PTY",\n                missingRequiredFunctionality: "missing functionality"\n'''
          new = '''                missingPersistentPTYCapability: "missing persistent PTY",\n                missingRequiredFunctionality: "missing functionality",\n                cloudNotificationClearWorkspaceInvalid: "invalid workspace",\n                cloudNotificationClearWorkspaceDenied: "workspace denied",\n                cloudNotificationClearSurfaceInvalid: "invalid surface"\n'''
          if old not in s:
              raise SystemExit('RemoteDaemonStrings fixture drifted')
          p.write_text(s.replace(old, new, 1))
          PY
          git add Packages/macOS/CmuxRemoteDaemon/Tests/CmuxRemoteDaemonTests/RemoteDaemonRPCClientWriteAdmissionScalingTests.swift
          git commit -m 'test(remote): reproduce physical serialized writer stall'
          echo "RED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: RED N=1 physical stalled writer through production seam
        shell: bash
        env:
          CMUX_FIELDWORK_SCALING: '1'
          CMUX_FIELDWORK_SCALING_CASES: '1'
        run: |
          set -euo pipefail
          set +e
          swift test --package-path Packages/macOS/CmuxRemoteDaemon --filter physicalWriteStallMustBoundQueuedCallers 2>&1 | tee /tmp/945-red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F '1 queued RPC callers remained behind one physical write past the write-liveness budget' /tmp/945-red.log
          echo "945 RED exit=$status red_sha=$RED_SHA base=$BASE_SHA"
      - name: Apply bounded non-WebSocket write-liveness repair
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick --no-commit 843accd73070a441ae4d24aa88e1a21bbbe02bc7
          git cherry-pick --no-commit ff826debbdcc0a392aefd7e01a77839a2a865cb7
          git cherry-pick --no-commit cc558390af891a0d98b0b1f25c8b0ff435bd26b4
          git commit -m 'fix(remote): bound serialized daemon writes by liveness budget'
          echo "GREEN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git diff --check "$BASE_SHA" HEAD
      - name: GREEN full 1 10 50 200 request notification and responsive controls
        shell: bash
        env:
          CMUX_FIELDWORK_SCALING: '1'
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxRemoteDaemon --filter RemoteDaemonRPCClientWriteAdmissionScalingTests 2>&1 | tee /tmp/945-scaling-green.log
          grep -F 'physical stdio write stall does not strand queued RPC timeouts at scale' /tmp/945-scaling-green.log
          grep -F 'notification-only PTY writes do not strand bridge workers at scale' /tmp/945-scaling-green.log
          grep -F 'responsive stdio transport settles 200 concurrent RPC callers' /tmp/945-scaling-green.log
      - name: GREEN focused timeout isolation and WebSocket unchanged controls
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/macOS/CmuxRemoteDaemon --filter timedOutPTYAttachPreservesHealthyTransportState
          swift test --package-path Packages/macOS/CmuxRemoteDaemon --filter timedOutPTYAttachBoundsCancellationWrite
          grep -n 'configuration.transport == .websocket' Packages/macOS/CmuxRemoteDaemon/Sources/CmuxRemoteDaemon/Client/RemoteDaemonRPCClient+RPC.swift
          echo "945 GREEN green_sha=$GREEN_SHA base=$BASE_SHA"
      - name: Push evidence branch
        run: git push --force origin HEAD:refs/heads/fieldwork/945-remote-write-liveness-refresh-52d0a696
