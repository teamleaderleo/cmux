name: Fieldwork RPC target verifier

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fieldwork-rpc-target-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: fieldwork/rpc-target-keys-10910
          fetch-depth: 1

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run focused control-socket tests
        run: |
          swift test \
            --package-path Packages/macOS/CmuxControlSocket \
            --filter ControlCommandCoordinatorMobileHostTests
