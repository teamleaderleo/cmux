name: Conversation sidebar localization one-shot

on:
  push:
    branches:
      - feat/conversation-sidebar-current-main

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "chore: apply conversation sidebar localization"

      - name: Add conversation sidebar translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("Resources/Localizable.xcstrings")
          text = path.read_text(encoding="utf-8")

          locales = ["en", "ja", "zh-Hans", "de", "fr", "ar", "es", "zh-Hant", "ko"]

          def entry(key, values):
              body = ",\n".join(
                  f'''        {json.dumps(locale)}: {{
                    "stringUnit": {{
                      "state": "translated",
                      "value": {json.dumps(values[locale], ensure_ascii=False)}
                    }}
                  }}'''
                  for locale in locales
              )
              return f'''    {json.dumps(key)}: {{
                "extractionState": "manual",
                "localizations": {{
          {body}
                }}
              }},
          '''

          records = {
              "settings.betaFeatures.conversationSidebar": {
                  "en": "Conversation Sidebar",
                  "ja": "会話サイドバー",
                  "zh-Hans": "对话侧边栏",
                  "de": "Konversations-Seitenleiste",
                  "fr": "Barre latérale des conversations",
                  "ar": "الشريط الجانبي للمحادثات",
                  "es": "Barra lateral de conversaciones",
                  "zh-Hant": "對話側邊欄",
                  "ko": "대화 사이드바",
              },
              "settings.betaFeatures.conversationSidebar.subtitleOff": {
                  "en": "Hides Conversations while preserving existing agent sessions.",
                  "ja": "既存のエージェントセッションを保持したまま、「会話」を非表示にします。",
                  "zh-Hans": "隐藏“对话”，同时保留现有智能体会话。",
                  "de": "Blendet „Konversationen“ aus und behält vorhandene Agent-Sitzungen bei.",
                  "fr": "Masque les conversations tout en conservant les sessions d’agent existantes.",
                  "ar": "يخفي «المحادثات» مع الاحتفاظ بجلسات الوكيل الحالية.",
                  "es": "Oculta Conversaciones y conserva las sesiones de agente existentes.",
                  "zh-Hant": "隱藏「對話」，同時保留現有代理程式工作階段。",
                  "ko": "기존 에이전트 세션은 유지하면서 대화를 숨깁니다.",
              },
              "settings.betaFeatures.conversationSidebar.subtitleOn": {
                  "en": "Shows Conversations in the left sidebar picker.",
                  "ja": "左側サイドバーの選択メニューに「会話」を表示します。",
                  "zh-Hans": "在左侧边栏选择器中显示“对话”。",
                  "de": "Zeigt „Konversationen“ im Auswahlmenü der linken Seitenleiste an.",
                  "fr": "Affiche les conversations dans le sélecteur de la barre latérale gauche.",
                  "ar": "يعرض «المحادثات» في منتقي الشريط الجانبي الأيسر.",
                  "es": "Muestra Conversaciones en el selector de la barra lateral izquierda.",
                  "zh-Hant": "在左側側邊欄選取器中顯示「對話」。",
                  "ko": "왼쪽 사이드바 선택기에 대화를 표시합니다.",
              },
              "sidebar.provider.conversations.subtitle": {
                  "en": "Coding-agent sessions",
                  "ja": "コーディングエージェントのセッション",
                  "zh-Hans": "编码智能体会话",
                  "de": "Sitzungen von Coding-Agenten",
                  "fr": "Sessions d’agents de programmation",
                  "ar": "جلسات وكلاء البرمجة",
                  "es": "Sesiones de agentes de programación",
                  "zh-Hant": "程式設計代理程式工作階段",
                  "ko": "코딩 에이전트 세션",
              },
              "sidebar.provider.conversations.title": {
                  "en": "Conversations",
                  "ja": "会話",
                  "zh-Hans": "对话",
                  "de": "Konversationen",
                  "fr": "Discussions",
                  "ar": "المحادثات",
                  "es": "Conversaciones",
                  "zh-Hant": "對話",
                  "ko": "대화",
              },
          }

          for key in records:
              marker = json.dumps(key) + ":"
              if marker in text:
                  raise SystemExit(f"{key}: already exists")

          settings = "".join(
              entry(key, records[key])
              for key in (
                  "settings.betaFeatures.conversationSidebar",
                  "settings.betaFeatures.conversationSidebar.subtitleOff",
                  "settings.betaFeatures.conversationSidebar.subtitleOn",
              )
          )
          providers = "".join(
              entry(key, records[key])
              for key in (
                  "sidebar.provider.conversations.subtitle",
                  "sidebar.provider.conversations.title",
              )
          )

          settings_anchor = '    "settings.betaFeatures.customSidebars": {'
          provider_anchor = '    "sidebar.provider.default.subtitle": {'
          if text.count(settings_anchor) != 1 or text.count(provider_anchor) != 1:
              raise SystemExit("localization insertion anchor changed")

          text = text.replace(settings_anchor, settings + settings_anchor, 1)
          text = text.replace(provider_anchor, providers + provider_anchor, 1)

          parsed = json.loads(text)
          required = {"en", "de", "fr", "ar", "es", "zh-Hant", "zh-Hans", "ko", "ja"}
          for key, values in records.items():
              record = parsed["strings"].get(key)
              if record is None:
                  raise SystemExit(f"{key}: insertion missing")
              got = set(record.get("localizations", {}))
              if got != required:
                  raise SystemExit(f"{key}: locales {sorted(got)}")
              for locale in required:
                  unit = record["localizations"][locale].get("stringUnit", {})
                  if unit.get("state") != "translated" or not unit.get("value", "").strip():
                      raise SystemExit(f"{key}:{locale}: invalid translation")
                  if locale != "en" and unit["value"] == values["en"]:
                      raise SystemExit(f"{key}:{locale}: untranslated English")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate localization catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/localization_catalog.py check --catalog Resources/Localizable.xcstrings --limit 0
          python3 tests/test_localizable_xcstrings_structure.py

      - name: Commit catalog and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/conversation-sidebar-l10n-once.yml
          git add Resources/Localizable.xcstrings
          git diff --cached --check
          git diff --cached --quiet && { echo "No localization changes"; exit 1; }
          git commit -m "l10n: translate conversation sidebar beta"
          git push origin HEAD:feat/conversation-sidebar-current-main
