name: Fieldwork apply terminal input ACK review fixes

on:
  push:
    branches:
      - fieldwork/terminal-input-owner-ack-review-fixes-20260907

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/terminal-input-owner-ack-current-main
          fetch-depth: 0

      - name: Apply exact rustfmt layout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9d9e1f06c31e4a28c02c5fff300148b8a7c6f7c3"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("cmux-tui/crates/cmux-tui-core/src/terminal_host_runtime.rs")
          text = path.read_text()
          pattern = r"            let shutdown = self\n                \.control_responses\n                \.input_ack_shutdown_handle\(&self\.writer\)\n                \.map_err\(\|error\| \{\n                    self\.control_responses\.release_input_ack\(payload\.len\(\)\);\n                    ConfirmedInputFailure::Known\(error\)\n                \}\)\?;"
          replacement = "            let shutdown = self.control_responses.input_ack_shutdown_handle(&self.writer).map_err(\n                |error| {\n                    self.control_responses.release_input_ack(payload.len());\n                    ConfirmedInputFailure::Known(error)\n                },\n            )?;"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected one rustfmt target, found {count}")
          path.write_text(text)
          PY
          git diff --check
          git diff -- cmux-tui/crates/cmux-tui-core/src/terminal_host_runtime.rs

      - name: Commit product formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cmux-tui/crates/cmux-tui-core/src/terminal_host_runtime.rs
          git commit -m 'chore(cmux-tui): format input receipt shutdown path'
          git push origin HEAD:fix/terminal-input-owner-ack-current-main
