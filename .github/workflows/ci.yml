name: CI

# Experiment branch only (exp/cascade-probe): measures how far one edit spreads
# through an incremental cmux build. Never merged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            setting: ""
          - variant: cross-module-incremental
            setting: "OTHER_SWIFT_FLAGS=$(inherited) -enable-experimental-cross-module-incremental-build"
          - variant: implicit-modules
            setting: "SWIFT_ENABLE_EXPLICIT_MODULES=NO"
    runs-on: macos-26
    timeout-minutes: 340
    env:
      CMUX_CI_REQUIRED_MACOS_SDK_MAJOR: "26"
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - run: ./scripts/select-ci-xcode.sh
      - run: |
          ./scripts/install-rust-ci.sh
          ./scripts/download-prebuilt-ghosttykit.sh
      - run: scripts/ci/compile-app-host-test-product.sh resolve "$RUNNER_TEMP/dd/DerivedData" "$PWD/.ci-source-packages"
      - name: Probe
        env:
          SETTING: ${{ matrix.setting }}
        run: |
          args=()
          [ -n "$SETTING" ] && args+=("$SETTING")
          scripts/exp/cascade_probe.sh "$RUNNER_TEMP/dd/DerivedData" "$PWD/.ci-source-packages" "$RUNNER_TEMP/out" ${args[@]+"${args[@]}"}
      - if: always()
        run: |
          echo "### ${{ matrix.variant }}" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' "$RUNNER_TEMP/out/results.jsonl" >> "$GITHUB_STEP_SUMMARY" || true
          for f in "$RUNNER_TEMP"/out/*.log; do grep -E "error:|BUILD FAILED" "$f" | head -5; done || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-${{ matrix.variant }}
          path: ${{ runner.temp }}/out
          retention-days: 7
