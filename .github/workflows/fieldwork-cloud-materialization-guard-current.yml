name: Fieldwork cloud materialization install guard current main

on:
  pull_request:
    branches:
      - fieldwork/cloud-materialization-guard-current-verifier-base-544c0e0f
    paths:
      - "web/services/vms/drivers/cmuxTuiDaemon.ts"
      - "web/tests/vm-cmux-tui-materialization-install-guard.test.ts"
      - ".github/workflows/fieldwork-cloud-materialization-guard-current.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Require exact hardening provenance
        run: |
          git merge-base --is-ancestor f2ead616bb02f9bd09162d7c04bde0658b68355c HEAD
          test "$(git rev-parse f2ead616bb02f9bd09162d7c04bde0658b68355c^)" = "695f982c36b6d56e6ec02d05763764e24817ed50"
          git diff --exit-code f2ead616bb02f9bd09162d7c04bde0658b68355c HEAD -- web

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run current-main install-guard tests
        working-directory: web
        run: bun test tests/vm-cmux-tui-materialization-install-guard.test.ts tests/vm-cmux-tui-materialization-provider.test.ts
