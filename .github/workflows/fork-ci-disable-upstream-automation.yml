name: Fork CI disable upstream automation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fork-ci-disable-upstream-automation.yml"

permissions:
  actions: write
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: true

      - name: Make upstream release automation manual-only in this fork
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def manual_only(path: Path) -> None:
              text = path.read_text()
              start = text.index('on:\n')
              end = text.index('\nconcurrency:\n', start)
              on_body = text[start + len('on:\n'):end]
              wd = on_body.index('  workflow_dispatch:')
              manual = on_body[wd:]
              new_on = 'on:\n' + manual
              new = text[:start] + new_on + text[end:]
              active_block = new[new.index('on:\n'):new.index('\nconcurrency:\n')]
              if '  schedule:' in active_block or '  push:' in active_block:
                  raise SystemExit(f'automatic trigger survived in {path}')
              path.write_text(new)

          manual_only(Path('.github/workflows/nightly.yml'))
          manual_only(Path('.github/workflows/ios-testflight.yml'))

          docs = Path('docs/ci-runners.md')
          text = docs.read_text()
          needle = (
              'Provider-specific macOS and manual test lanes '
              'are separate and must be opted into explicitly.\n'
          )
          replacement = (
              'Provider-specific macOS and manual test lanes '
              'are separate and must be opted into explicitly. The upstream Nightly macOS '
              'and CMUX INTERNAL TestFlight workflows are manual-only in this fork.\n'
          )
          if needle in text:
              docs.write_text(text.replace(needle, replacement, 1))
          elif 'manual-only in this fork' not in text:
              raise SystemExit('fork runner documentation marker missing')

          Path('.github/workflows/fork-ci-disable-upstream-automation.yml').unlink()
          PY
          git diff --check

      - name: Validate fork CI contracts
        run: |
          python3 tests/test_tui_publish_workflow_security.py -v
          bash tests/test_ci_self_hosted_guard.sh

      - name: Create validated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows docs/ci-runners.md
          git commit -m 'ci: keep upstream release automation manual in fork [skip ci]'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          git show --stat --oneline --summary HEAD
          git push origin HEAD:main || true

      - name: Cancel queued runs spawned before migration
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for state in queued pending waiting requested; do
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue
              gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
            done < <(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?status=$state&per_page=100" --jq '.workflow_runs[].id')
          done
