name: Fieldwork terminal input owner ack

on:
  pull_request:
    branches:
      - fieldwork/upstream-20260901-2ead477

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply owner-ack patch
        run: python3 .github/fieldwork/apply_terminal_input_owner_ack.py

      - name: Initialize Ghostty
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang libclang-dev pkg-config

      - name: Resolve Ghostty Zig version
        id: ghostty-zig-version
        shell: bash
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.ghostty-zig-version.outputs.version }}

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Format and check patch
        working-directory: cmux-tui
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Test terminal host and content paths
        working-directory: cmux-tui
        run: |
          cargo test -p cmux-tui-core --lib terminal_host
          cargo test -p cmux-tui-core --lib resource_router::content::tests

      - name: Commit tested source patch and remove helpers
        shell: bash
        run: |
          rm .github/workflows/fieldwork-apply-terminal-input-fix.yml
          rm .github/fieldwork/apply_terminal_input_owner_ack.py
          rmdir .github/fieldwork 2>/dev/null || true
          git config user.name "Fieldwork"
          git config user.email "fieldwork@users.noreply.github.com"
          git add -A
          git commit -m "fix(cmux-tui): acknowledge receipted terminal input"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
