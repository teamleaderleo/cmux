name: fieldwork apply terminal input owner ack

on:
  push:
    branches:
      - fix/terminal-input-owner-ack
    paths:
      - .github/workflows/fieldwork-apply-terminal-input-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Apply owner-ack patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          protocol = "cmux-tui/crates/cmux-tui-core/src/terminal_host_protocol.rs"
          replace_once(
              protocol,
              "    DetachAck = 22,\n    Input = 100,",
              "    DetachAck = 22,\n    /// Targeted confirmation that `Input` reached the authoritative PTY writer.\n    InputAck = 23,\n    Input = 100,",
          )
          replace_once(
              protocol,
              "            22 => Ok(Self::DetachAck),\n            100 => Ok(Self::Input),",
              "            22 => Ok(Self::DetachAck),\n            23 => Ok(Self::InputAck),\n            100 => Ok(Self::Input),",
