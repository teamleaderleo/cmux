name: Fork current-main candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fork-candidate-current-main.yml

permissions:
  contents: read

env:
  UPSTREAM_BASE_SHA: 6b425641ae4d474e77854da535442af2a0d0a475
  RED_SHA: 4719143f4a21ab2442397efe70643435c1f604f6
  GREEN_SHA: a732c5994bb2a698a7330bb0516210411d9ca298
  SWIFT_BACKTRACE: interactive=no,timeout=0s,symbolicate=off,color=no
  CMUX_SKIP_ZIG_BUILD: "1"

jobs:
  verify-candidate:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GREEN_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify candidate ancestry and diff
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RED_SHA^")" = "$UPSTREAM_BASE_SHA"
          test "$(git rev-parse "$GREEN_SHA^")" = "$RED_SHA"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$RED_SHA" | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only "$UPSTREAM_BASE_SHA" "$RED_SHA")" = "cmuxTests/RemoteTmuxAuthTests.swift"

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Prepare DerivedData
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="${RUNNER_TEMP}/cmux-current-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$DERIVED_DATA_PATH"
          echo "CMUX_DERIVED_DATA_PATH=$DERIVED_DATA_PATH" >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          mkdir -p "$SOURCE_PACKAGES_DIR"
          xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
            -resolvePackageDependencies

      - name: Prove regression commit is red at the assertion
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RED_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          set +e
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/sendKeysChunksBoundaryPasteIntoControlSafeCommands \
              test 2>&1 | tee /tmp/red.log
          RED_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$RED_STATUS" -eq 0 ]; then
            echo "expected the test-only commit to fail"
            exit 1
          fi
          grep -F "sendKeysChunksBoundaryPasteIntoControlSafeCommands" /tmp/red.log
          grep -F "Expectation failed" /tmp/red.log

      - name: Prove fix commit is green
        run: |
          set -euo pipefail
          git checkout --detach "$GREEN_SHA"
          SOURCE_PACKAGES_DIR="$PWD/.ci-source-packages"
          python3 scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
              -derivedDataPath "$CMUX_DERIVED_DATA_PATH" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_DIR" \
              -disableAutomaticPackageResolution \
              -destination "platform=macOS" \
              EXCLUDED_SOURCE_FILE_NAMES="BrowserPanelTests.swift BrowserPanelViewIdentityTests.swift" \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/boundaryPasteIsSplitIntoControlSafeCommands \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/sendKeysRejectsOverBudgetLogicalInputWithoutPartialDelivery \
              -only-testing:cmuxTests/RemoteTmuxAuthTests/sendKeysAcceptsRawAdmissionLimitWithProductionWriterBudget \
              test

      - name: Run package framing tests
        run: swift test --package-path Packages/macOS/CmuxRemoteSession --filter RemoteTmuxSendKeysBatchBuilderTests

      - name: Run package tests
        run: swift test --package-path Packages/macOS/CmuxRemoteSession

      - name: Repository guards
        run: |
          set -euo pipefail
          git diff --check "$UPSTREAM_BASE_SHA" "$GREEN_SHA"
          ./scripts/lint-pbxproj-test-wiring.sh
          python3 scripts/check-package-resolved-policy.py
          python3 scripts/check-workspace-package-groups.py --check
