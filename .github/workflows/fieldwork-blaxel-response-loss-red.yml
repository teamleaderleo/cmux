name: Fieldwork Blaxel response-loss RED

on:
  pull_request:
    branches:
      - fieldwork/cmux-blaxel-response-loss-execution-base

permissions:
  contents: read

concurrency:
  group: fieldwork-blaxel-response-loss-red-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: eaa899cb20bd411019744fbd2bdedeb397f3070b
  RED_SHA: 6c268876c5695621ca2b4a227cd9b1fb6da5c0fb

jobs:
  verify-red:
    name: Prove response-loss orphan on retry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact regression commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RED_SHA }}
          fetch-depth: 0

      - name: Verify regression-only diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$TARGET_SHA" "$RED_SHA")" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA" "$RED_SHA")" = "web/tests/vm-blaxel-response-loss.test.ts"
          git diff --check "$TARGET_SHA" "$RED_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Start and migrate isolated test database
        working-directory: web
        env:
          CMUX_DB_TEST: "1"
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
          DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
        run: |
          set -euo pipefail
          ./scripts/db-local.sh up
          bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Definite pre-effect failure negative control
        working-directory: web
        env:
          CMUX_DB_TEST: "1"
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
          DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
        run: >-
          bun test --max-concurrency=1
          tests/vm-blaxel-response-loss.test.ts
          -t 'same-key retry after a definite pre-effect provider failure creates only one remote machine'

      - name: Prove ambiguous response loss is RED for the intended reason
        working-directory: web
        env:
          CMUX_DB_TEST: "1"
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
          DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bun test --max-concurrency=1 \
            tests/vm-blaxel-response-loss.test.ts \
            -t 'same-key retry must not create B while response-lost Blaxel create A still exists' \
            2>&1 | tee /tmp/cmux-blaxel-response-loss-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected current source to violate the response-loss ownership invariant"
            exit 1
          fi
          grep -F "same-key retry created B while response-lost provider effect A remained live and unowned" /tmp/cmux-blaxel-response-loss-red.log
          echo "observed expected product-path RED exit: $status"

      - name: Tear down test database
        if: always()
        working-directory: web
        env:
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
        run: ./scripts/db-local.sh down || true
