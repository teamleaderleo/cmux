name: Fieldwork cloud materialization boot gate

on:
  pull_request:
    branches:
      - fieldwork/cloud-materialization-boot-verifier-base-20260901
    paths:
      - "web/services/vms/drivers/cmuxTuiMaterialization.ts"
      - "web/tests/vm-cmux-tui-materialization.test.ts"
      - ".github/workflows/fieldwork-cloud-materialization-boot.yml"

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require exact PR head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run materialization boot-gate tests
        working-directory: web
        run: bun test tests/vm-cmux-tui-materialization.test.ts
