name: Fieldwork terminal input ACK 2026-09-07

on:
  push:
    branches:
      - fieldwork/terminal-input-owner-ack-20260907-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BASE_COMMIT: 7d78b6e4cb0236c3b4eb354d851498b685801e00
      PRODUCT_COMMIT: 406f5e88335ae359df53c16c5637155dc54a5045
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Require exact wrapper and product ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_COMMIT"
          test "$(git merge-base "$BASE_COMMIT" "$PRODUCT_COMMIT")" = "$BASE_COMMIT"
          git diff --check "$BASE_COMMIT" "$PRODUCT_COMMIT"
          git diff --name-only "$BASE_COMMIT" "$PRODUCT_COMMIT" | sort > /tmp/product-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          cmux-tui/crates/cmux-tui-core/src/resource_router/content.rs
          cmux-tui/crates/cmux-tui-core/src/surface.rs
          cmux-tui/crates/cmux-tui-core/src/terminal_host_protocol.rs
          cmux-tui/crates/cmux-tui-core/src/terminal_host_runtime.rs
          cmux-tui/crates/cmux-tui-core/src/workspace_registry/tests.rs
          cmux-tui/crates/cmux-tui/tests/cli.rs
          cmux-tui/spec/inventory.json
          cmux-tui/spec/terminal-host.md
          EOF
          diff -u /tmp/expected-files.txt /tmp/product-files.txt

      - name: Check out current upstream baseline
        run: git checkout --detach "$BASE_COMMIT"

      - name: Init Ghostty submodule
        run: git submodule update --init --depth 1 ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Characterize current-upstream full core
        working-directory: cmux-tui
        shell: bash
        run: |
          set +e
          cargo test -p cmux-tui-core --lib --locked -- --nocapture 2>&1 | tee /tmp/baseline-core.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/baseline-core.log').read_text(errors='replace').splitlines()
          in_failures = False
          failures = set()
          for line in lines:
              if line.strip() == 'failures:':
                  in_failures = True
                  continue
              if in_failures and line.startswith('test result:'):
                  break
              if in_failures and re.match(r'^    [A-Za-z0-9_].*::', line):
                  failures.add(line.strip())
          Path('/tmp/baseline-failures.txt').write_text(
              ''.join(f'{name}\n' for name in sorted(failures))
          )
          PY
          echo "baseline full-core exit status: $status"
          cat /tmp/baseline-failures.txt
          if [ "$status" -ne 0 ]; then
            grep -q '^test result: FAILED\.' /tmp/baseline-core.log
            test -s /tmp/baseline-failures.txt
          fi

      - name: Check out exact receipted-input candidate
        run: |
          git checkout --detach "$PRODUCT_COMMIT"
          git submodule update --init --depth 1 ghostty
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"

      - name: Check formatting and generated boundaries
        working-directory: cmux-tui
        run: |
          cargo fmt --all -- --check
          python3 scripts/test_check_spec_inventory.py
          python3 scripts/check-spec-inventory.py
          python3 scripts/test_check_resource_api_boundary.py
          python3 scripts/check-resource-api-boundary.py
          python3 bindings/codegen/generate.py --check

      - name: Run receipted input regressions
        working-directory: cmux-tui
        run: |
          cargo test -p cmux-tui-core --lib receipted_input_ --locked -- --nocapture
          cargo test -p cmux-tui-core --lib host_input_receipt_follows_the_pty_write --locked -- --nocapture
          cargo test -p cmux-tui-core --lib interactive_input_keeps_fire_and_forget_semantics --locked -- --nocapture

      - name: Run resource-router regressions
        working-directory: cmux-tui
        run: cargo test -p cmux-tui-core --lib resource_router::content::tests --locked -- --nocapture

      - name: Require no candidate-only full-core failures
        working-directory: cmux-tui
        shell: bash
        run: |
          set +e
          cargo test -p cmux-tui-core --lib --locked -- --nocapture 2>&1 | tee /tmp/candidate-core.log
          status=${PIPESTATUS[0]}
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/candidate-core.log').read_text(errors='replace').splitlines()
          in_failures = False
          failures = set()
          for line in lines:
              if line.strip() == 'failures:':
                  in_failures = True
                  continue
              if in_failures and line.startswith('test result:'):
                  break
              if in_failures and re.match(r'^    [A-Za-z0-9_].*::', line):
                  failures.add(line.strip())
          Path('/tmp/candidate-failures.txt').write_text(
              ''.join(f'{name}\n' for name in sorted(failures))
          )
          PY
          echo "candidate full-core exit status: $status"
          cat /tmp/candidate-failures.txt
          if [ "$status" -ne 0 ]; then
            grep -q '^test result: FAILED\.' /tmp/candidate-core.log
            test -s /tmp/candidate-failures.txt
          fi
          comm -13 /tmp/baseline-failures.txt /tmp/candidate-failures.txt > /tmp/candidate-only-failures.txt
          if [ -s /tmp/candidate-only-failures.txt ]; then
            echo "candidate introduced failures absent from current upstream:" >&2
            cat /tmp/candidate-only-failures.txt >&2
            exit 1
          fi
          echo "candidate introduced no new full-core failing tests"

      - name: Record verified boundary
        run: |
          echo "base=$BASE_COMMIT"
          echo "candidate=$PRODUCT_COMMIT"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')"
          git diff --check "$BASE_COMMIT" "$PRODUCT_COMMIT"
