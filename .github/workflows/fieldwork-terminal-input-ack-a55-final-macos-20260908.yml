name: Fieldwork terminal input ACK a55 final macOS

on:
  push:
    branches:
      - fieldwork/terminal-input-ack-a55-final-macos-20260908

permissions:
  contents: read

env:
  BASE_COMMIT: 7d78b6e4cb0236c3b4eb354d851498b685801e00
  PRODUCT_COMMIT: a55ddc3c9b3fc39988c8524f0eb85a5311e61d3b
  PIPELINE_REGRESSION: surface::tests::hosted_receipted_input_requests_pipeline_through_surface_reader

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false

      - name: Require exact wrapper and product ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT_COMMIT"
          test "$(git merge-base "$BASE_COMMIT" "$PRODUCT_COMMIT")" = "$BASE_COMMIT"
          git checkout --detach "$PRODUCT_COMMIT"
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          git diff --check "$BASE_COMMIT" HEAD
          git diff --name-only "$BASE_COMMIT" HEAD | sort > /tmp/product-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          cmux-tui/crates/cmux-tui-core/src/diagnostics.rs
          cmux-tui/crates/cmux-tui-core/src/mux.rs
          cmux-tui/crates/cmux-tui-core/src/resource_router/content.rs
          cmux-tui/crates/cmux-tui-core/src/server.rs
          cmux-tui/crates/cmux-tui-core/src/surface.rs
          cmux-tui/crates/cmux-tui-core/src/terminal_host_protocol.rs
          cmux-tui/crates/cmux-tui-core/src/terminal_host_runtime.rs
          cmux-tui/crates/cmux-tui-core/src/workspace_registry/tests.rs
          cmux-tui/crates/cmux-tui/tests/cli.rs
          cmux-tui/spec/inventory.json
          cmux-tui/spec/terminal-host.md
          EOF
          diff -u /tmp/expected-files.txt /tmp/product-files.txt
          git submodule update --init --depth 1 ghostty

      - name: Supply gofmt for generated-binding check
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: stable
          cache: false

      - name: Install repository-pinned Zig
        run: ./scripts/install-zig-ci.sh

      - name: Set up repository-pinned Rust
        uses: ./.github/actions/setup-cmux-tui-rust

      - name: Check formatting and generated boundaries
        working-directory: cmux-tui
        run: |
          command -v gofmt
          cargo fmt --all -- --check
          python3 scripts/test_check_spec_inventory.py
          python3 scripts/check-spec-inventory.py
          python3 scripts/test_check_resource_api_boundary.py
          python3 scripts/check-resource-api-boundary.py
          python3 bindings/codegen/generate.py --check

      - name: Run final receipted-input and diagnostics regressions
        working-directory: cmux-tui
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p cmux-tui-core --lib --locked terminal_input_receipt_stats_distinguish_submission_ack_wait_and_timeout_pressure -- --nocapture
          cargo test -p cmux-tui-core --lib --locked host_receipted_input_partial_write_closes_connection_without_ack -- --nocapture
          cargo test -p cmux-tui-core --lib --locked host_receipted_input_flush_failure_closes_connection_without_ack -- --nocapture
          cargo test -p cmux-tui-core --lib --locked host_input_ack_total_budget_rejection_is_post_delivery_connection_loss -- --nocapture
          cargo test -p cmux-tui-core --lib --locked hosted_receipted_input_disconnect_after_submit_is_indeterminate -- --nocapture
          cargo test -p cmux-tui-core --lib --locked receipted_input_ -- --nocapture
          cargo test -p cmux-tui-core --lib --locked host_input_receipt_follows_pty_write_and_flush -- --nocapture
          cargo test -p cmux-tui-core --lib --locked interactive_input_keeps_fire_and_forget_semantics -- --nocapture
          cargo test -p cmux-tui-core --lib --locked hosted_receipted_input_ack_round_trips_through_surface_reader -- --nocapture
          cargo test -p cmux-tui-core --lib --locked server_stats_report_lock_writer_and_connection_metrics -- --nocapture
          cargo test -p cmux-tui-core --lib --locked resource_router::content::tests -- --nocapture

      - name: Repeat Surface pipelining regression twenty times
        working-directory: cmux-tui
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            cargo test -p cmux-tui-core --lib --locked "$PIPELINE_REGRESSION" -- --exact > /tmp/pipeline-repeat.log 2>&1 || { cat /tmp/pipeline-repeat.log; exit 1; }
            grep -F 'test result: ok. 1 passed; 0 failed;' /tmp/pipeline-repeat.log
          done

      - name: Record exact verified product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "base=$BASE_COMMIT"
          echo "candidate=$PRODUCT_COMMIT"
          echo "candidate_tree=$(git rev-parse 'HEAD^{tree}')"
          git diff --check "$BASE_COMMIT" HEAD
