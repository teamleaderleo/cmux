name: Fieldwork Blaxel create response-loss repair

on:
  push:
    branches:
      - fieldwork/blaxel-create-response-loss-repair-carrier-20260901

permissions:
  contents: write

concurrency:
  group: fieldwork-blaxel-create-response-loss-repair-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 950371857bb8774c59f40046e5605c6bdf002181
  RED_SHA: e34a515f307b6a1c5f94395d1045b3bd4f8f633e
  CANDIDATE_BRANCH: fieldwork/blaxel-create-response-loss-repair-20260901

jobs:
  build-green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout carrier tooling
        uses: actions/checkout@v4
        with:
          ref: fieldwork/blaxel-create-response-loss-repair-carrier-20260901
          path: carrier
          fetch-depth: 1

      - name: Checkout canonical RED branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          path: candidate
          fetch-depth: 0

      - name: Verify exact test-only RED head
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RED_SHA"
          test "$(git merge-base "$BASE_SHA" "$RED_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" "$RED_SHA")" = "web/tests/vm-blaxel-create-response-loss-repair.test.ts"

      - name: Materialize production repair
        run: |
          set -euo pipefail
          cd candidate
          python3 ../carrier/scripts/fieldwork_blaxel_response_loss_repair.py
          test "$(git diff --name-only)" = $'web/services/vms/drivers/blaxel.ts\nweb/services/vms/repository.ts'
          git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: candidate/web
        run: bun install --frozen-lockfile

      - name: Prove driver repair green
        working-directory: candidate/web
        run: bun test tests/vm-blaxel-create-response-loss-repair.test.ts -t 'Blaxel re-reads the deterministic sandbox before cleaning up an ambiguous create'

      - name: Run Blaxel retry and provider controls
        working-directory: candidate/web
        run: |
          set -euo pipefail
          bun test tests/vm-blaxel-fetch-retry.test.ts
          bun test tests/vm-blaxel-provider.test.ts

      - name: Start and migrate isolated test database
        working-directory: candidate/web
        env:
          CMUX_DB_TEST: "1"
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
          DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
        run: |
          set -euo pipefail
          ./scripts/db-local.sh up
          bunx drizzle-kit migrate --config drizzle.config.ts

      - name: Prove workflow identity repair green
        working-directory: candidate/web
        env:
          CMUX_DB_TEST: "1"
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
          DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
          DIRECT_DATABASE_URL: postgres://cmux:cmux@localhost:33777/cmux_test
        run: |
          set -euo pipefail
          bun test --max-concurrency=1 tests/vm-blaxel-create-response-loss-repair.test.ts -t 'same-key retry preserves one provider create identity across an ambiguous first create'
          bun test --max-concurrency=1 tests/vm-workflows.test.ts -t 'transient provider create failure does not poison the idempotency key'

      - name: Tear down test database
        if: always()
        working-directory: candidate/web
        env:
          CMUX_DB_KIND: test
          CMUX_DB_PORT_OFFSET: "30000"
          CMUX_DB_NAME: cmux_test
        run: ./scripts/db-local.sh down || true

      - name: Commit and push canonical GREEN
        if: success()
        working-directory: candidate
        run: |
          set -euo pipefail
          git config user.name 'Fieldwork'
          git config user.email 'fieldwork@users.noreply.github.com'
          git add web/services/vms/repository.ts web/services/vms/drivers/blaxel.ts
          git commit -m 'fix: reconcile ambiguous Blaxel creates by durable identity'
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" = "2"
          test "$(git rev-parse HEAD^1)" = "$RED_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD | sort)" = $'web/services/vms/drivers/blaxel.ts\nweb/services/vms/repository.ts\nweb/tests/vm-blaxel-create-response-loss-repair.test.ts'
          git push origin HEAD:"$CANDIDATE_BRANCH"
