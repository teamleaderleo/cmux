name: cmux-tui spec inventory

on:
  push:
    branches:
      - main
      - fieldwork/upstream-main-9e2dd509-github-hosted
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
  pull_request:
    paths:
      - "cmux-tui/**"
      - ".github/workflows/cmux-tui-spec.yml"
  workflow_dispatch:

concurrency:
  group: cmux-tui-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork-runner-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fieldwork/upstream-main-9e2dd509-github-hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Route ordinary fork PR checks to GitHub-hosted Linux
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('.github/workflows/cmux-skill-contract.yml'),
              Path('.github/workflows/testbox-broker-guard.yml'),
              Path('.github/workflows/cmux-tui-spec.yml'),
              Path('.github/workflows/cmux-tui-sdks.yml'),
          ]
          pattern = re.compile(r"blacksmith-[0-9]+vcpu-ubuntu-[0-9]+")
          changed = []
          for path in paths:
              text = path.read_text()
              new = pattern.sub('ubuntu-24.04', text)
              if new != text:
                  path.write_text(new)
                  changed.append(str(path))
          print('\n'.join(changed))
          if len(changed) != 4:
              raise SystemExit(f'expected four workflow changes, got {len(changed)}')
          PY
          git diff --check

      - name: Commit runner override
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cmux-skill-contract.yml \
                  .github/workflows/testbox-broker-guard.yml \
                  .github/workflows/cmux-tui-spec.yml \
                  .github/workflows/cmux-tui-sdks.yml
          git commit -m 'ci: use GitHub-hosted Linux for fork PR checks'
          git push origin HEAD:fieldwork/upstream-main-9e2dd509-github-hosted

  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test inventory checker
        run: python3 cmux-tui/scripts/test_check_spec_inventory.py

      - name: Test frontend documentation protocol
        run: python3 cmux-tui/scripts/test_frontend_docs.py

      - name: Check protocol and TUI action inventory
        run: python3 cmux-tui/scripts/check-spec-inventory.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: cmux-tui/bindings
        run: python3 -m unittest discover -s cmux-tui/bindings/codegen/tests -v

      - name: Test SDK schema checker
        run: python3 cmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime inventory
        run: python3 cmux-tui/scripts/check-sdk-schema.py

      - name: Test public resource boundary checker
        run: python3 cmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 cmux-tui/scripts/check-resource-api-boundary.py

      - name: Check generated SDK wire layers
        run: python3 cmux-tui/bindings/codegen/generate.py --check
