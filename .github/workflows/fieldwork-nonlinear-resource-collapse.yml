name: Fieldwork nonlinear resource collapse

on:
  push:
    branches:
      - fieldwork/nonlinear-resource-collapse
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-backpressure-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin landed revision
        run: git rev-parse HEAD
      - name: Verify landed source and clean diff
        run: |
          grep -q 'const MAX_PENDING_RECORDS: usize = MAX_BATCH_RECORDS;' \
            cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs
          grep -q 'post_completion_handoff_keeps_the_next_ready_batch_exact' \
            cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs
          git diff --check
      - name: Apply byte-threshold candidate when needed and recovery harness
        run: |
          if ! grep -q 'fn pending_threshold_reached' cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs; then
            git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch
            git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_byte_threshold.patch
          fi
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_recovery_harness.patch
          git diff --check
      - name: Run journal-forwarder unit tests
        run: |
          cargo test \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            journal_forwarder::tests::
      - name: Build live journal harness
        run: |
          cargo build \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog
      - name: Run healthy 50-session negative control
        run: |
          mkdir -p journal-source-results
          cargo run --quiet \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog -- \
            --mode ack \
            --sessions 50 \
            --records-per-session 300 \
            --payload-bytes 1024 \
            > journal-source-results/ack-50.json
          cat journal-source-results/ack-50.json
      - name: Run stalled fixed-duration scaling sequence
        run: |
          for sessions in 1 10 50 128 200; do
            echo "=== stalled sessions=${sessions} ==="
            cargo run --quiet \
              --manifest-path cmux-tui/Cargo.toml \
              -p chatmux-relay \
              --example fieldwork_journal_backlog -- \
              --mode stall \
              --sessions "${sessions}" \
              --records-per-session 1000000 \
              --payload-bytes 1024 \
              --load-millis 1500 \
              --settle-millis 100 \
              > "journal-source-results/stall-${sessions}.json"
            cat "journal-source-results/stall-${sessions}.json"
          done
      - name: Run stall-stop-recover settle probe
        run: |
          cargo run --quiet \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog -- \
            --mode recover \
            --sessions 128 \
            --records-per-session 1000000 \
            --payload-bytes 1024 \
            --load-millis 1500 \
            --settle-millis 100 \
            > journal-source-results/recover-128.json
          cat journal-source-results/recover-128.json
      - name: Preserve landed-source measurements
        uses: actions/upload-artifact@v4
        with:
          name: journal-source-results
          path: journal-source-results/*.json

  macos-rpc-upstream-baseline:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ef183f1e5de765b183aec9d1799f17a0848ae84
      - name: Toolchain
        run: swift --version
      - name: Pin upstream baseline
        run: git rev-parse HEAD
      - name: Run pinned upstream package concurrently
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon
      - name: Run pinned upstream timeout-isolation suite together
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run pinned upstream preserve-after-timeout discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachPreservesHealthyTransportState
      - name: Run pinned upstream blocked-cancellation discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachBoundsCancellationWrite

  macos-rpc-candidate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Pin candidate revision
        run: git rev-parse HEAD
      - name: Run package outside timeout-isolation suite
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --skip RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run candidate timeout-isolation suite together
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run preserve-after-timeout discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachPreservesHealthyTransportState
      - name: Run blocked-cancellation discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachBoundsCancellationWrite
      - name: Run request + notification write scaling probes
        env:
          CMUX_FIELDWORK_SCALING: "1"
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientWriteAdmissionScalingTests
