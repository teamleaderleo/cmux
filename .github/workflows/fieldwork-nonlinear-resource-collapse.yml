name: Fieldwork nonlinear resource collapse

on:
  push:
    branches:
      - fieldwork/nonlinear-resource-collapse
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-unpatched-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin unpatched revision
        run: git rev-parse HEAD
      - name: Verify journal source remains upstream-pinned
        run: |
          test "$(git rev-parse HEAD:cmux-tui/crates/chatmux-relay/src/journal_forwarder.rs)" = \
            "9b4551770e807084c48c2cdbe94f15f2cf2358e0"
      - name: Build live journal harness
        run: |
          cargo build \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog
      - name: Run stalled matched-duration scaling sequence
        run: |
          mkdir -p journal-unpatched-results
          for sessions in 1 10 50 128 200; do
            echo "=== unpatched stalled sessions=${sessions} ==="
            cargo run --quiet \
              --manifest-path cmux-tui/Cargo.toml \
              -p chatmux-relay \
              --example fieldwork_journal_backlog -- \
              --mode stall \
              --sessions "${sessions}" \
              --records-per-session 1000000 \
              --payload-bytes 1024 \
              --load-millis 1500 \
              --settle-millis 100 \
              > "journal-unpatched-results/stall-${sessions}.json"
            cat "journal-unpatched-results/stall-${sessions}.json"
          done
      - name: Preserve matched unpatched measurements
        uses: actions/upload-artifact@v4
        with:
          name: journal-unpatched-results
          path: journal-unpatched-results/*.json

  journal-backpressure-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pin candidate revision
        run: git rev-parse HEAD
      - name: Apply journal backpressure candidate
        run: |
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_backpressure.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_backpressure.patch
          git apply --check --recount scripts/fieldwork/cmux-resource-collapse/journal_backpressure_handoff.patch
          git apply --recount scripts/fieldwork/cmux-resource-collapse/journal_backpressure_handoff.patch
          git diff --check
      - name: Run journal-forwarder unit tests
        run: |
          cargo test \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            journal_forwarder::tests::
      - name: Build live journal harness
        run: |
          cargo build \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog
      - name: Run healthy 50-session negative control
        run: |
          mkdir -p journal-backpressure-results
          cargo run --quiet \
            --manifest-path cmux-tui/Cargo.toml \
            -p chatmux-relay \
            --example fieldwork_journal_backlog -- \
            --mode ack \
            --sessions 50 \
            --records-per-session 300 \
            --payload-bytes 1024 \
            > journal-backpressure-results/ack-50.json
          cat journal-backpressure-results/ack-50.json
      - name: Run stalled fixed-duration scaling sequence
        run: |
          for sessions in 1 10 50 128 200; do
            echo "=== stalled sessions=${sessions} ==="
            cargo run --quiet \
              --manifest-path cmux-tui/Cargo.toml \
              -p chatmux-relay \
              --example fieldwork_journal_backlog -- \
              --mode stall \
              --sessions "${sessions}" \
              --records-per-session 1000000 \
              --payload-bytes 1024 \
              --load-millis 1500 \
              --settle-millis 100 \
              > "journal-backpressure-results/stall-${sessions}.json"
            cat "journal-backpressure-results/stall-${sessions}.json"
          done
      - name: Preserve journal candidate measurements
        uses: actions/upload-artifact@v4
        with:
          name: journal-backpressure-results
          path: journal-backpressure-results/*.json

  macos-rpc-upstream-baseline:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ef183f1e5de765b183aec9d1799f17a0848ae84
      - name: Toolchain
        run: swift --version
      - name: Pin upstream baseline
        run: git rev-parse HEAD
      - name: Run pinned upstream package concurrently
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon
      - name: Run pinned upstream timeout-isolation suite together
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run pinned upstream preserve-after-timeout discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachPreservesHealthyTransportState
      - name: Run pinned upstream blocked-cancellation discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachBoundsCancellationWrite

  macos-rpc-candidate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Pin candidate revision
        run: git rev-parse HEAD
      - name: Run package outside timeout-isolation suite
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --skip RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run candidate timeout-isolation suite together
        continue-on-error: true
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientTimeoutIsolationTests
      - name: Run preserve-after-timeout discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachPreservesHealthyTransportState
      - name: Run blocked-cancellation discriminator alone
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter timedOutPTYAttachBoundsCancellationWrite
      - name: Run request + notification write scaling probes
        env:
          CMUX_FIELDWORK_SCALING: "1"
        run: |
          swift test \
            --package-path Packages/macOS/CmuxRemoteDaemon \
            --filter RemoteDaemonRPCClientWriteAdmissionScalingTests
